name = "poetrycodex-engine"
main = "src/index.js"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

# The Oracle is the costliest route, so it has an off switch. Set to "true"
# and redeploy to bring it back; nothing else on the site depends on it.
[vars]
ORACLE_ENABLED = "false"

# Most paid model calls the engine will make in one UTC day, across all visitors.
# 150 is roughly $6 a day at the October 2026 prices (about $180 a month at the
# very most). Saved readings do not count and keep working after the limit.
# Raise it here and redeploy if a busy day (a class, a link going round) hits it.
DAILY_PAID_LIMIT = "150"

# The API key is NOT stored here. It is set once as an encrypted secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
# or in the Cloudflare dashboard under
#   Workers & Pages -> poetrycodex-engine -> Settings -> Variables -> Secret.

# Per-visitor throttle: six readings a minute from one IP is generous for a
# reader and useless for anyone trying to drain the balance.
[[ratelimits]]
name = "ANALYZE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# The Oracle costs several times what a single reading does, so it gets its own,
# tighter bucket on top of the shared one.
[[ratelimits]]
name = "ORACLE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

# Readings that have already been written, keyed by poem and lens. Each one is
# paid for once; every later reader gets it back for nothing.
[[kv_namespaces]]
binding = "READINGS"
id = "31a49e2007dd42b48a0b00e3f86fb017"
