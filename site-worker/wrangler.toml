# poetrycodex-site: the Worker that serves poetrycodex.com from R2 (see src/index.js).
# The published files are copied into the bucket by tools/sync_r2.py.
name = "poetrycodex-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The domain is served by this Worker since 15 Oct 2026 (the owner's go-ahead after testing
# the workers.dev address). To go back to GitHub Pages, comment the routes out and run
# `wrangler deploy` again: the DNS records still point at GitHub and never change.
# (Top-level keys must come before the [[r2_buckets]] table, or TOML puts them inside it.)
routes = [
  { pattern = "poetrycodex.com/*", zone_name = "poetrycodex.com" },
  { pattern = "www.poetrycodex.com/*", zone_name = "poetrycodex.com" },
]

# Reader accounts (src/accounts.js). The Google client id is public (every visitor's browser
# sees it); there is no client secret. Empty = the sign-in button stays hidden.
[vars]
GOOGLE_CLIENT_ID = ""
SITE_ORIGINS = "https://poetrycodex.com"

[[d1_databases]]
binding = "DB"
database_name = "poetrycodex-readers"
database_id = "0a2e2da3-562d-43d7-a49f-77b3901d3e8c"

[[r2_buckets]]
binding = "SITE"
bucket_name = "poetrycodex-site"
